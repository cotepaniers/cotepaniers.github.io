<section class="hero {% if page.hero_height %} {{ page.hero_height }} {% else %} is-medium {% endif %} is-bold is-primary" {% if page.hero_image %} style="background: linear-gradient(rgba(17, 92, 39, 0.28), rgba(17, 92, 39, 0.28)), url('{{ page.hero_image | prepend: site.baseurl }}') no-repeat center center; background-size: cover; background-position: center;" {% endif %}>
    <div class="hero-body">
        <div class="container">
            <p class="title is-2">
    {{ page.title }}</p>
            <p class="subtitle is-3">{{ page.subtitle }}</p>
            {% if page.hero_link %}
                <a href="{{ page.hero_link | prepend: site.baseurl  }}" class="button is-info is-large">{{ page.hero_link_text }}</a>
            {% endif %}
        </div>
    </div>
</section>
