<section class="hero hero-custom {% if page.hero_height %} {{ page.hero_height }} {% else %} is-medium {% endif %} is-bold is-primary" {% if page.hero_image %} style="background: linear-gradient(rgba(19, 59, 30, 0.28), rgba(19, 59, 30, 0.38)), url('{{ page.hero_image | prepend: site.baseurl }}') no-repeat center center; background-size: cover; background-position: center;" {% endif %}>
    <div class="hero-body">
        <div class="container">
            <div class="hero-inner">
                <div class="hero-copy">
                    <p class="title is-2">{{ page.title }}</p>
                    {% if page.subtitle %}
                    <p class="subtitle is-3">{{ page.subtitle }}</p>
                    {% endif %}
                    {% if page.hero_link %}
                        <a href="{{ page.hero_link | prepend: site.baseurl }}" class="button is-info is-large">{{ page.hero_link_text }}</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
