<section class="hero {% if page.hero_height %} {{ page.hero_height }} {% else %} is-medium {% endif %} is-bold is-primary hero-custom{% if page.url == '/' %} home-hero{% endif %}" {% if page.url == '/' %}{% assign hero_bg = page.hero_image | default: '/img/Banniere_site.png' %} style="background: url('{{ hero_bg | prepend: site.baseurl }}') center center / cover no-repeat; background-color: #f4efe3;" {% else %} style="background: url('{{ '/Banniere_pages-2.png' | prepend: site.baseurl }}') center center / cover no-repeat; background-color: #f4efe3;" {% endif %}>
    <div class="hero-body">
        <div class="container">
            <p class="title is-2">{{ page.title }}</p>
            {% if page.subtitle %}
                <p class="subtitle is-3">{{ page.subtitle }}</p>
            {% endif %}
        </div>
    </div>
    {% if page.hero_link %}
        <div class="hero-cta">
            <div class="container">
                <a href="{{ page.hero_link | prepend: site.baseurl }}" class="button is-primary is-large">{{ page.hero_link_text }}</a>
            </div>
        </div>
    {% endif %}
</section>
