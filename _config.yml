# Welcome to Jekyll!
title: Côté Paniers
tagline: l'AMAP de Charenton
email: cotepaniers@gmail.com
description: >-
  Site de l'AMAP de Charenton-le-Pont, Côté Paniers, Association pour le Maintien d'une Agriculture Paysanne, organisant la distribution de paniers de légumes bio, œufs bio, produits laitiers, en circuit court.
baseurl: ""
url: ""
permalink: pretty
favicon: /img/favicon_detoure.png

github_username: cotepaniers

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - kramdown
  - rouge

exclude:
  - Gemfile
  - clean-theme.gemspec
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

livereload: true

sass:
  style: compressed
  source_dir: _sass

google_analytics: UA-155306021-1

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      show_sidebar: true
  - scope:
      path: ""
      type: "posts"
    values:
      author: "Alex Salvador"
      layout: post
      image: https://via.placeholder.com/1200x800
      show_sidebar: true

markdown: kramdown
highlighter: rouge
